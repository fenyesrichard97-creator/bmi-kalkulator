<!DOCTYPE html>
<html>
<head>
    <title>BMI kalkulátor</title>
</head>
<body>

    <h1>BMI kalkulátor</h1>

    <form method="POST" action="/">

        <label>Név:</label>
        <input type="text" name="nev">

        <br><br>

        <label>Életkor:</label>
        <input type="number" name="kor">

        <br><br>

        <label>Magasság (cm):</label>
        <input type="number" name="magassag">

        <br><br>

        <label>Súly (kg):</label>
        <input type="number" name="suly">

        <br><br>

        <button type="submit">Számítás</button>

    </form>

</body>
</html>
